<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賓果單字格式化工具</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 解析 PDF 的套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- 解析 Word (.docx) 的套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="max-w-3xl w-full bg-white shadow-xl rounded-2xl p-8 border border-slate-100">
        <h1 class="text-2xl font-bold text-slate-900 mb-2 flex items-center gap-2">
            🎯 賓果單字格式化工具
        </h1>
        <p class="text-sm text-slate-500 mb-6">
            上傳 PDF/Word 教材或直接貼上文字，系統將自動從教材中尋找單字單元，轉化為標準格式清單。
        </p>

        <!-- 檔案上傳區 -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">上傳教材檔案 (支援 PDF, Word .docx, 純文字檔)</label>
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt" onchange="handleFileUpload(event)"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-slate-50 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
        </div>

        <!-- 輸入區 -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">原始教材內容 / 單字表（或由上方檔案自動填入）</label>
            <textarea id="inputText" rows="8" placeholder="請在此貼上教材內容，或透過上方上傳檔案..."
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <!-- 執行按鈕 -->
        <button id="processBtn" onclick="processText()" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition-colors shadow-sm">
            開始智慧萃取單字
        </button>

        <!-- 輸出區 -->
        <div class="mt-6">
            <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-semibold text-slate-600 uppercase">處理結果（可直接複製貼上至賓果遊戲）</label>
                <button onclick="copyResult()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">📋 一鍵複製</button>
            </div>
            <textarea id="outputText" rows="8" readonly placeholder="處理後的清單將顯示在此..."
                class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-mono focus:outline-none"></textarea>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz39UJezOwk_8wC3Jd6tvnyrFZM26TiSgTWo68tN3TJJ1kWkcUteR5D3nLzQBJBMmF3hg/exec";

        // 處理檔案上傳與自動解析
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const inputField = document.getElementById('inputText');
            inputField.value = "正在讀取檔案內容，請稍候...";

            const fileName = file.name.toLowerCase();

            try {
                if (fileName.endsWith('.pdf')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += `--- Page ${i} ---\n` + pageText + "\n\n";
                    }
                    inputField.value = fullText;
                } else if (fileName.endsWith('.docx')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    inputField.value = result.value;
                } else if (fileName.endsWith('.txt')) {
                    const text = await file.text();
                    inputField.value = text;
                } else {
                    alert('目前僅支援 PDF、Word (.docx) 與純文字檔 (.txt)');
                    inputField.value = '';
                }
            } catch (error) {
                inputField.value = '';
                alert('解析檔案時發生錯誤：' + error.message);
            }
        }

        async function processText() {
            const inputText = document.getElementById('inputText').value.trim();
            const outputBox = document.getElementById('outputText');
            const btn = document.getElementById('processBtn');

            if (!inputText) {
                alert('請先輸入或上傳教材內容！');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'AI 正在智慧識別單字單元中，請稍候...';
            outputBox.value = '處理中...';

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ text: inputText })
                });

                const data = await response.json();
                if (data.success) {
                    outputBox.value = data.result;
                } else {
                    outputBox.value = '發生錯誤：' + (data.error || '未知錯誤');
                }
            } catch (error) {
                outputBox.value = '網路連線或伺服器呼叫失敗：' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '開始智慧萃取單字';
            }
        }

        function copyResult() {
            const outputBox = document.getElementById('outputText');
            outputBox.select();
            navigator.clipboard.writeText(outputBox.value);
            alert('已成功複製到剪貼簿！');
        }
    </script>
</body>
</html>
